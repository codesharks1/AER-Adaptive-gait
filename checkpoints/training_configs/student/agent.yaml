seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 3000
empirical_normalization: null
obs_groups:
  policy:
  - student
  teacher:
  - policy
clip_actions: null
save_interval: 100
experiment_name: go2_demo
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-07-29_17-03-20
load_checkpoint: model_6997.pt
class_name: DistillationRunner
policy:
  class_name: StudentTeacherRecurrent
  init_noise_std: 0.1
  noise_std_type: scalar
  student_obs_normalization: false
  teacher_obs_normalization: false
  student_hidden_dims:
  - 512
  - 256
  - 128
  teacher_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  rnn_type: gru
  rnn_hidden_dim: 247
  rnn_num_layers: 1
  teacher_recurrent: false
algorithm:
  class_name: Distillation
  num_learning_epochs: 2
  learning_rate: 0.001
  gradient_length: 24
  max_grad_norm: 1.0
  optimizer: adam
  loss_type: huber
